<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loves Me, Loves Me Not 🌼</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="romantic-couple">
    <div class="couple-emoji">👩🏻‍❤️‍👨🏻</div>
    <div class="couple-caption">Under the same stars, forever together ❤️</div>
</div>
        <!-- Magical night garden -->
<div class="night-grass" id="nightGrass"></div>

<!-- Twinkling stars -->
<div class="night-stars" id="nightStars"></div>
        <!-- Music Button -->
<button id="musicButton" type="button">
    ♫
</button>
        <div class="stars" id="stars"></div>

        <div class="moon"></div>
        <div class="rainbow"></div>

        <h1 id="message">LOVES ME?</h1>

        <div class="flower" id="flower">
            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>

            <div class="petals" id="petals"></div>
            <div class="center"></div>
        </div>

        <div class="flower-field" id="flowerField"></div>

        <div class="hearts" id="hearts"></div>

        <p class="instruction" id="instruction">
            Tap the flower to pick a petal 🌸
        </p>

        <button id="replay" onclick="resetGame()">
            Play Again 💗
        </button>
    </div>
<!-- Background Music -->
<audio id="backgroundMusic" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>
    <script src="script.js"></script>
</body>
</html>
